name: Feature request
description: Suggest a otito improvement.
title: "feature: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should otito do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Any workaround, competing tool, or simpler path you considered?
  - type: dropdown
    id: surface
    attributes:
      label: Affected Surface
      options:
        - CLI
        - MCP
        - GitHub Actions
        - generated reports
        - code map
        - docs
        - other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues before opening this one.
          required: true
