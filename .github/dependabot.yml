version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # TypeScript is a runtime dependency because repoctx uses the compiler API.
    # Major releases require an explicit compatibility migration and must not
    # be opened or auto-merged as routine dependency maintenance.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
