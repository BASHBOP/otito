name: Release

on:
  push:
    tags:
      - "v*"
  # tag-release.yml starts this on the tag it pushes: a tag pushed with
  # GITHUB_TOKEN does not trigger the push event above.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      # npm Trusted Publishing (OIDC) requires npm >= 11.5.1; Node 22 ships an
      # older npm. Upgrade so `npm publish` can authenticate via id-token.
      - name: Update npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Verify tag matches package version
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "Release runs on a v* tag, not the $GITHUB_REF_TYPE $GITHUB_REF_NAME" >&2
            exit 1
          fi
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      # A version can already be on npm: a new package's first publish is done by
      # hand (npm Trusted Publishing is configured per existing package), or this
      # is a re-run after a later job failed. npm refuses to publish a version
      # twice, so skip it and let the GitHub Release and MCP Registry jobs run.
      - name: Check whether this version is already on npm
        id: npm
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm; skipping npm publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      # prepublishOnly runs the full quality gate (npm run ci) before publish.
      - name: Publish
        if: steps.npm.outputs.published != 'true'
        run: npm publish

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the release

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            /^## / { if (found) exit; if ($2 == "[" ver "]") { found = 1; next } }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "No CHANGELOG.md section found for v$VERSION; using fallback notes." >&2
            echo "Release $GITHUB_REF_NAME. See CHANGELOG.md for details." > "$RUNNER_TEMP/release-notes.md"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag

  publish-mcp:
    name: Publish to MCP Registry
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for MCP Registry GitHub OIDC login

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/').tar.gz" | tar xz mcp-publisher

      - name: Log in to the MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      # The MCP Registry validates server.json's npm package/version against
      # the public registry. A fresh `npm publish` can take a few minutes to
      # propagate (npm says so itself), so poll for it instead of racing it.
      - name: Wait for npm registry propagation
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Waiting for @bashbop/solumbe@$VERSION to be visible on the npm registry..."
          for i in $(seq 1 20); do
            if curl -sf "https://registry.npmjs.org/@bashbop/solumbe/$VERSION" > /dev/null; then
              echo "Found @bashbop/solumbe@$VERSION on the registry."
              exit 0
            fi
            echo "Not yet available (attempt $i/20), retrying in 15s..."
            sleep 15
          done
          echo "Timed out waiting for @bashbop/solumbe@$VERSION to appear on the npm registry." >&2
          exit 1

      - name: Publish server.json
        run: ./mcp-publisher publish
