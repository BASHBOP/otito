name: repoctx CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:

permissions:
  contents: read
  issues: write
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality gates
        run: npm run ci

  docs:
    name: Docs build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install docs dependencies
        run: pip install mkdocs-material mkdocs-mermaid2-plugin

      - name: Build docs
        run: mkdocs build --strict

  review:
    name: Generate PR review context
    runs-on: ubuntu-latest
    needs: [quality, docs]

    steps:
      - name: Checkout PR head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Checkout pushed commit
        if: github.event_name == 'push'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        run: git fetch origin "+${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" --depth=1

      - name: Generate PR review context
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node src/cli.js pr . \
            --base "origin/${{ github.base_ref }}" \
            --head HEAD \
            --number "${{ github.event.pull_request.number }}" \
            --out .dev-context/pr-review.md \
            --comment

      - name: Generate commit review context
        if: github.event_name == 'push'
        run: |
          BASE="${{ github.event.before }}"
          if ! git rev-parse --verify "$BASE^{commit}" >/dev/null 2>&1; then
            if git rev-parse --verify "HEAD~1^{commit}" >/dev/null 2>&1; then
              BASE="HEAD~1"
            else
              BASE="HEAD"
            fi
          fi

          node src/cli.js pr . \
            --base "$BASE" \
            --head "${{ github.sha }}" \
            --out .dev-context/pr-review.md

      - name: Upload PR review artifact
        uses: actions/upload-artifact@v7
        with:
          name: repoctx-pr-review
          path: .dev-context/pr-review.md

  pullpass-readiness:
    name: PullPass readiness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Checkout pushed commit
        if: github.event_name == 'push'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        run: git fetch origin "+${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" --depth=1

      # repoctx's own merge-readiness gate (impact + PR review + local pass).
      # Exits non-zero only on a blocking FAIL verdict; WARN does not block.
      - name: Evaluate merge readiness
        if: github.event_name == 'pull_request'
        run: node src/cli.js review . --base "origin/${{ github.base_ref }}" --head HEAD

      - name: Evaluate merge readiness (push)
        if: github.event_name == 'push'
        run: |
          BASE="${{ github.event.before }}"
          if ! git rev-parse --verify "$BASE^{commit}" >/dev/null 2>&1; then
            if git rev-parse --verify "HEAD~1^{commit}" >/dev/null 2>&1; then
              BASE="HEAD~1"
            else
              BASE="HEAD"
            fi
          fi

          node src/cli.js review . --base "$BASE" --head HEAD

  attest-main:
    name: Post-merge audit attestation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [quality]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Attest merge on main
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/post-merge-attest.sh

      - name: Upload attestation artifacts
        uses: actions/upload-artifact@v7
        with:
          name: repoctx-audit-attestation
          path: |
            audit-pilot/ledger.jsonl
            audit-pilot/verdict-latest.json
