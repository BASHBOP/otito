name: PullPass

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  readiness:
    name: PullPass readiness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Install PullPass
        run: go install github.com/nugehs/pullpass/cmd/pullpass@v0.8.0

      - name: Run PullPass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pullpass pr "${{ github.event.pull_request.number }}" \
            --repo . \
            --governance solo
