<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">repoctx terminal splash design print</title>
  <desc id="desc">A terminal-style repoctx splash with a greeting and repository context graph.</desc>
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061a22" />
      <stop offset="0.58" stop-color="#101827" />
      <stop offset="1" stop-color="#211432" />
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" />
      <stop offset="0.48" stop-color="#2dd4bf" />
      <stop offset="1" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="softShadow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#020617" flood-opacity="0.4" />
    </filter>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#22d3ee" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1200" height="640" fill="#06232d" />
  <rect x="42" y="38" width="1116" height="564" rx="18" fill="#e5e7eb" opacity="0.96" />
  <rect x="76" y="78" width="1048" height="500" rx="14" fill="url(#screen)" filter="url(#softShadow)" />
  <rect x="76" y="78" width="1048" height="36" rx="14" fill="#151a3d" />
  <path d="M76 104 H1124" stroke="#243b63" stroke-width="1" />

  <circle cx="104" cy="96" r="7" fill="#f87171" />
  <circle cx="128" cy="96" r="7" fill="#fbbf24" />
  <circle cx="152" cy="96" r="7" fill="#34d399" />
  <text x="600" y="101" text-anchor="middle" fill="#cbd5e1" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    ~ : repoctx -- terminal
  </text>

  <rect x="250" y="134" width="700" height="42" rx="3" fill="#0b2430" stroke="#155e75" stroke-width="1.4" stroke-dasharray="5 5" opacity="0.96" />
  <text
    x="600"
    y="162"
    text-anchor="middle"
    fill="#c4f1f9"
    font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="22"
    filter="url(#textGlow)"
  >
    Hello builder, welcome to repoctx
  </text>
  <path d="M600 176 v31" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 6" opacity="0.8" />

  <g font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#22d3ee" filter="url(#textGlow)">
    <text x="368" y="232">.------------+------------.</text>
    <text x="350" y="265">/ local repo context \</text>
    <text x="336" y="298">/____________________________\</text>
    <text x="418" y="340">o----o----o----o</text>
    <text x="392" y="374" xml:space="preserve">repo map ctx review</text>
    <text x="430" y="408" xml:space="preserve">| | | |</text>
    <text x="382" y="442">files routes tests prompts</text>
  </g>

  <text x="170" y="532" fill="#94a3b8" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">
    $ repoctx context "ship the change" --path .
  </text>
  <rect x="170" y="548" width="438" height="5" rx="2.5" fill="url(#glow)" />
</svg>
